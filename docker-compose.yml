version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: telegram-attack-bot
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - MONGO_URI=mongodb://mongo:27017/guru_bot
      - PANEL_URL=${PANEL_URL}
      - PANEL_USERNAME=${PANEL_USERNAME}
      - PANEL_PASSWORD=${PANEL_PASSWORD}
      - OWNER_ID=${OWNER_ID}
      - PSEUDO_OWNER_ID=${PSEUDO_OWNER_ID}
      - DEFAULT_CONCURRENT=${DEFAULT_CONCURRENT}
      - MIN_CONCURRENT=${MIN_CONCURRENT}
      - MAX_CONCURRENT=${MAX_CONCURRENT}
      - MIN_DURATION=${MIN_DURATION}
      - MAX_DURATION=${MAX_DURATION}
      - PORT=${PORT}
    volumes:
      - ./screenshots:/app/screenshots
    depends_on:
      - mongo
    networks:
      - bot-network

  mongo:
    image: mongo:6
    container_name: telegram-bot-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - bot-network

volumes:
  mongo-data:

networks:
  bot-network:
    driver: bridge
